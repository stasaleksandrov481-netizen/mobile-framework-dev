name: CORTEX Edge and Billing Regression Tests

on:
  pull_request:
    paths:
      - "supabase/functions/cortex/**"
      - "cortex-control/api/billing.js"
      - "cortex-control/tests/**"
      - ".github/workflows/edge-security-tests.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/functions/cortex/**"
      - "cortex-control/api/billing.js"
      - "cortex-control/tests/**"
      - ".github/workflows/edge-security-tests.yml"

permissions:
  contents: read

jobs:
  edge-contract:
    name: Edge auth, quotas and settings regression
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Run Edge Function regression tests
        run: node --experimental-transform-types --test supabase/functions/cortex/handler.test.ts

  billing-contract:
    name: Billing webhook and payment regression
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Run billing tests
        run: node --test cortex-control/tests/billing.test.js
