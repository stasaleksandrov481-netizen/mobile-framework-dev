name: CORTEX Android APK and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a NEW signed APK release (requires an unused versionName and a higher versionCode)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  # Public configuration only. The signing private key must never be embedded in an APK.
  CORTEX_WEB_UPDATE_ROOT: ${{ vars.CORTEX_WEB_UPDATE_ROOT }}
  CORTEX_WEB_UPDATE_PUBLIC_KEY: ${{ vars.CORTEX_WEB_UPDATE_PUBLIC_KEY }}

concurrency:
  # Keep production signing serialized, but avoid making every PR wait behind unrelated builds.
  group: cortex-android-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Build and verify CORTEX
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release request
        id: release_request
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish_release }}
        run: |
          publish=false
          if [[ "$EVENT" == "workflow_dispatch" && "$MANUAL_PUBLISH" == "true" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Signed releases can only be published from main."
            exit 1
          fi
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            subject="$(git log -1 --format=%s)"
            version=$(sed -nE 's/^[[:space:]]*versionName = "([0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?)".*/\1/p' app/build.gradle.kts)
            if [[ ( "$EVENT" == "workflow_dispatch" && "$MANUAL_PUBLISH" == "true" ) ||
                  ( "$EVENT" == "push" && "$subject" == "release(cortex): publish $version" ) ||
                  ( "$EVENT" == "push" && "$subject" == "release(cortex): publish beta $version" ) ]]; then
              publish=true
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT" == "workflow_dispatch" && "$publish" == "false" ]]; then
            echo "::notice::Building an APK artifact without publishing a new GitHub release."
          fi

      - name: Validate Android release version before building
        id: release_metadata
        shell: bash
        env:
          PUBLISH_RELEASE: ${{ steps.release_request.outputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$PUBLISH_RELEASE" == "true" ]]; then
            published_tags="$RUNNER_TEMP/cortex-published-tags.txt"
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft == false) | .tag_name' > "$published_tags"
            python3 tools/android_release.py prepare --publish --commit "$GITHUB_SHA" \
              --published-tags "$published_tags" --output "$GITHUB_OUTPUT"
          else
            python3 tools/android_release.py prepare --output "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify gateway and billing
        run: node --disable-warning=ExperimentalWarning --experimental-transform-types --test supabase/functions/cortex/handler.test.ts supabase/functions/cortex/provider.test.ts supabase/functions/cortex/redis.test.ts supabase/functions/cortex/singleflight.test.ts cortex-control/tests/billing.test.js

      - name: Verify island onboarding, privacy and phone awareness
        run: node --test qa/island-onboarding.test.mjs qa/first-experience.test.mjs qa/island-command.test.mjs qa/island-surface-motion.test.mjs qa/memory.test.mjs qa/notification-awareness.test.mjs qa/account-email.test.mjs qa/markdown-layout.test.mjs qa/statistics.test.mjs qa/chat-beta-polish.test.mjs

      - name: Verify release metadata and signed WebView update packaging
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: Verify website and administrator console
        run: |
          npm ci --prefix cortex-web --no-audit --no-fund
          npm run build --prefix cortex-web
          npm run lint --prefix cortex-web
          node --disable-warning=ExperimentalWarning --experimental-strip-types --test cortex-web/scripts/hardening.test.mjs
          node --disable-warning=ExperimentalWarning --experimental-strip-types --test qa/health-route.test.mjs
          npm ci --prefix cortex-control --no-audit --no-fund
          npm run build --prefix cortex-control

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" || ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build and test Android
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      # Keep a test APK available even if the signing or GitHub release step fails.
      - name: Verify test APK output
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: CORTEX-test-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Show download instructions for test APK
        if: steps.release_request.outputs.publish != 'true'
        shell: bash
        run: |
          echo "### CORTEX test APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Download **CORTEX-test-debug-${{ github.run_number }}** from the Artifacts section of this run." >> "$GITHUB_STEP_SUMMARY"
          echo "This debug-signed APK cannot replace the existing release-signed CORTEX installation." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify release build and cache dependencies
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/cortex-gradle.log"
          for attempt in 1 2 3; do
            if gradle --no-daemon :app:assembleRelease 2>&1 | tee "$log"; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]] || ! grep -Eiq 'Received status code (429|502|503|504)|Read timed out|Connection reset' "$log"; then
              exit 1
            fi
            delay=$((attempt * 25))
            echo "::warning::Dependency host temporarily unavailable. Retrying Gradle in ${delay}s."
            sleep "$delay"
          done

      - name: Sign the CORTEX update
        if: steps.release_request.outputs.publish == 'true'
        id: signing
        shell: bash
        env:
          CORTEX_KEYSTORE_B64: ${{ secrets.CORTEX_KEYSTORE_B64 }}
          CORTEX_STORE_PASSWORD: ${{ secrets.CORTEX_STORE_PASSWORD }}
          CORTEX_KEY_ALIAS: ${{ secrets.CORTEX_KEY_ALIAS }}
          CORTEX_KEY_PASSWORD: ${{ secrets.CORTEX_KEY_PASSWORD }}
        run: |
          # Signed WebView updates are optional. Without both public values
          # the APK uses bundled UI; unsigned hot updates never run.
          if [[ -z "$CORTEX_WEB_UPDATE_ROOT" && -z "$CORTEX_WEB_UPDATE_PUBLIC_KEY" ]]; then
            echo "::notice::Signed WebView hot updates are disabled; publishing the bundled Android app."
          fi
          : "${CORTEX_KEYSTORE_B64:?Missing CORTEX_KEYSTORE_B64}"
          : "${CORTEX_STORE_PASSWORD:?Missing CORTEX_STORE_PASSWORD}"
          : "${CORTEX_KEY_ALIAS:?Missing CORTEX_KEY_ALIAS}"
          : "${CORTEX_KEY_PASSWORD:?Missing CORTEX_KEY_PASSWORD}"
          umask 077
          CORTEX_KEYSTORE_FILE=$(mktemp "$RUNNER_TEMP/cortex-signing.XXXXXXXX")
          export CORTEX_KEYSTORE_FILE
          trap 'rm -f "$CORTEX_KEYSTORE_FILE"' EXIT
          printf '%s' "$CORTEX_KEYSTORE_B64" | base64 --decode > "$CORTEX_KEYSTORE_FILE"
          unset CORTEX_KEYSTORE_B64
          # The unsigned release build above has already resolved its lint and build dependencies.
          gradle --no-daemon --offline :app:assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          # Keep the signing certificate used by the published 1.0.11 APK.
          expected=dbb16c019e7ea145c7600fe9e8411f7b929ba77c05d21fdaac91ca333631a274
          actual=$("$apksigner" verify --print-certs "$apk" | awk '/^Signer #[0-9]+ certificate SHA-256 digest:/ { print $NF }')
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::The APK certificate does not match the permanent CORTEX release certificate."
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Prepare download
        if: steps.signing.outputs.publish == 'true'
        id: apk
        shell: bash
        env:
          VERSION: ${{ steps.release_metadata.outputs.version }}
          APK_NAME: ${{ steps.release_metadata.outputs.name }}
          RELEASE_TAG: ${{ steps.release_metadata.outputs.tag }}
          PRERELEASE: ${{ steps.release_metadata.outputs.prerelease }}
        run: |
          # Recheck after signing in case another release created this tag during the build.
          git fetch origin --tags
          python3 tools/android_release.py prepare --publish --commit "$GITHUB_SHA"
          mkdir -p release
          test -s app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "release/$APK_NAME"
          (cd release && sha256sum "$APK_NAME" > SHA256SUMS.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Save APK artifact
        if: steps.signing.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CORTEX-${{ steps.apk.outputs.version }}-APK
          path: release/
          if-no-files-found: error

      - name: Publish version with APK
        if: steps.signing.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: CORTEX ${{ steps.apk.outputs.version }}
          generate_release_notes: true
          files: |
            release/${{ steps.apk.outputs.name }}
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true
          draft: false
          prerelease: ${{ steps.apk.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.apk.outputs.prerelease != 'true' }}

      - name: Verify downloadable release
        if: steps.signing.outputs.publish == 'true'
        id: verified_download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.apk.outputs.tag }}
          APK_NAME: ${{ steps.apk.outputs.name }}
          PRERELEASE: ${{ steps.apk.outputs.prerelease }}
        run: |
          verified="$(mktemp -d "$RUNNER_TEMP/cortex-download.XXXXXXXX")"
          verify_release_identity() {
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$verified/release.json" || return 1
            release_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha) || return 1
            python3 tools/android_release.py verify --response "$verified/release.json" \
              --commit "$GITHUB_SHA" --tag-commit "$release_commit" || return 1
            # GitHub /releases/latest deliberately excludes prereleases.
            if [[ "$PRERELEASE" != "true" ]]; then
              [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" == "$TAG" ]] || return 1
            fi
          }
          for attempt in 1 2 3; do
            if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --clobber --dir "$verified" \
                    --pattern "$APK_NAME" --pattern SHA256SUMS.txt &&
               cmp release/SHA256SUMS.txt "$verified/SHA256SUMS.txt" &&
               (cd "$verified" && sha256sum --check SHA256SUMS.txt) &&
               verify_release_identity; then
              exit 0
            fi
            if [[ "$attempt" != 3 ]]; then sleep 8; fi
          done
          echo "::error::GitHub did not confirm the new APK download and checksum."
          exit 1

      - name: Remove the superseded APK releases
        if: steps.verified_download.outcome == 'success' && steps.apk.outputs.tag == 'v1.0.17'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # These are the release IDs present at the approved 1.0.17 cutover.
          # Delete release records and their assets. Preserve Git refs.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | [.id, .tag_name] | @tsv' > "$RUNNER_TEMP/cortex-releases.tsv"
          while IFS=$'\t' read -r id tag; do
            case "$id:$tag" in
              450309417:v1.0.14-beta.195|\
              450219748:v1.0.14-beta.189|\
              450090383:v1.0.14-beta.187|\
              449734781:v1.0.14-beta.183|\
              448754330:v1.0.14-beta.171|\
              448582116:v1.0.14-beta.168|\
              447314243:v1.0.13-beta.109|\
              447229532:v1.0.12-beta.78|\
              446329208:v1.0.11|\
              446228787:v1.0.10|\
              446157746:v1.0.9|\
              446118557:v1.0.8|\
              446013782:v1.0.7|\
              445484318:v1.0.6|\
              445218104:v1.0.5|\
              444043533:v1.0.1|\
              443804525:v1.0.0|\
              443186424:v0.9.2|\
              442871564:v0.9.1|\
              442639526:v0.8.8|\
              440710063:v0.2.0|\
              440650063:v0.1.0)
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
                printf 'Removed old release %s\n' "$tag"
                ;;
            esac
          done < "$RUNNER_TEMP/cortex-releases.tsv"
