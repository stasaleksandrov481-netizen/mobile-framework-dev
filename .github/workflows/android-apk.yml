name: CORTEX Android APK and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a public signed beta release (not for private ZBT)
        type: boolean
        default: false

permissions:
  contents: write

env:
  # Public configuration only. The signing private key must never be embedded in an APK.
  CORTEX_WEB_UPDATE_ROOT: ${{ vars.CORTEX_WEB_UPDATE_ROOT }}
  CORTEX_WEB_UPDATE_PUBLIC_KEY: ${{ vars.CORTEX_WEB_UPDATE_PUBLIC_KEY }}

concurrency:
  group: cortex-android-release
  cancel-in-progress: false

jobs:
  android:
    name: Build and verify CORTEX
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify gateway and billing
        run: node --disable-warning=ExperimentalWarning --experimental-transform-types --test supabase/functions/cortex/handler.test.ts supabase/functions/cortex/provider.test.ts supabase/functions/cortex/redis.test.ts cortex-control/tests/billing.test.js

      - name: Verify island onboarding, privacy and phone awareness
        run: node --test qa/island-onboarding.test.mjs qa/island-command.test.mjs qa/memory.test.mjs qa/notification-awareness.test.mjs qa/account-email.test.mjs qa/markdown-layout.test.mjs qa/statistics.test.mjs

      - name: Verify signed WebView update packaging
        run: python3 -m unittest discover -s tools -p 'test_package_web_update.py' -v

      - name: Verify website and administrator console
        run: |
          npm ci --prefix cortex-web --no-audit --no-fund
          npm run build --prefix cortex-web
          npm run lint --prefix cortex-web
          node --disable-warning=ExperimentalWarning --experimental-strip-types --test cortex-web/scripts/hardening.test.mjs
          npm ci --prefix cortex-control --no-audit --no-fund
          npm run build --prefix cortex-control

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" || ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build and test Android
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest

      # Upload a test build on normal pushes. Public signed release remains gated.
      - name: Verify test APK output
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: CORTEX-test-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Sign the CORTEX update
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        id: signing
        shell: bash
        env:
          CORTEX_REQUIRE_PUBLISH: 'true'
          CORTEX_KEYSTORE_B64: ${{ secrets.CORTEX_KEYSTORE_B64 }}
          CORTEX_STORE_PASSWORD: ${{ secrets.CORTEX_STORE_PASSWORD }}
          CORTEX_KEY_ALIAS: ${{ secrets.CORTEX_KEY_ALIAS }}
          CORTEX_KEY_PASSWORD: ${{ secrets.CORTEX_KEY_PASSWORD }}
        run: |
          # Signed WebView updates are optional. Without both public values
          # the APK uses bundled UI; unsigned hot updates never run.
          if [[ -z "$CORTEX_WEB_UPDATE_ROOT" && -z "$CORTEX_WEB_UPDATE_PUBLIC_KEY" ]]; then
            echo "::notice::Signed WebView hot updates are disabled; publishing the bundled Android app."
          fi
          if [[ -z "$CORTEX_KEYSTORE_B64" && -z "$CORTEX_STORE_PASSWORD" &&
                -z "$CORTEX_KEY_ALIAS" && -z "$CORTEX_KEY_PASSWORD" ]]; then
            if [[ "$CORTEX_REQUIRE_PUBLISH" == 'true' ]]; then
              echo "::error::Add the permanent CORTEX signing key to GitHub Actions secrets. See README.md or clear the publish option to test the build."
              exit 1
            fi
            echo "::notice::Build verified. APK publication requires the permanent CORTEX signing key."
            exit 0
          fi
          : "${CORTEX_KEYSTORE_B64:?Missing CORTEX_KEYSTORE_B64}"
          : "${CORTEX_STORE_PASSWORD:?Missing CORTEX_STORE_PASSWORD}"
          : "${CORTEX_KEY_ALIAS:?Missing CORTEX_KEY_ALIAS}"
          : "${CORTEX_KEY_PASSWORD:?Missing CORTEX_KEY_PASSWORD}"
          umask 077
          CORTEX_KEYSTORE_FILE=$(mktemp "$RUNNER_TEMP/cortex-signing.XXXXXXXX")
          export CORTEX_KEYSTORE_FILE
          trap 'rm -f "$CORTEX_KEYSTORE_FILE"' EXIT
          printf '%s' "$CORTEX_KEYSTORE_B64" | base64 --decode > "$CORTEX_KEYSTORE_FILE"
          unset CORTEX_KEYSTORE_B64
          gradle --no-daemon :app:assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          expected=6a7967ebe2d0a5de51c02140ceade238bf1769b47bb2dcffc80bc955d650cf6b
          actual=$("$apksigner" verify --print-certs "$apk" | awk '/^Signer #[0-9]+ certificate SHA-256 digest:/ { print $NF }')
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::The APK certificate does not match the permanent CORTEX release certificate."
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Prepare download
        if: steps.signing.outputs.publish == 'true'
        id: apk
        shell: bash
        run: |
          version=$(sed -nE 's/^[[:space:]]*versionName = "([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' app/build.gradle.kts)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p release
          test -s app/build/outputs/apk/release/app-release.apk
          name="CORTEX-$version.apk"
          cp app/build/outputs/apk/release/app-release.apk "release/$name"
          (cd release && sha256sum "$name" > SHA256SUMS.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Save APK artifact
        if: steps.signing.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CORTEX-${{ steps.apk.outputs.version }}-APK
          path: release/
          if-no-files-found: error

      - name: Publish version with APK
        if: steps.signing.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}-beta.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: CORTEX ${{ steps.apk.outputs.version }} Beta ${{ github.run_number }}
          files: |
            release/${{ steps.apk.outputs.name }}
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true
          draft: false
          prerelease: true
          make_latest: false
