name: CORTEX website check

on:
  pull_request:
    paths:
      - 'cortex-web/**'
      - '.github/workflows/cortex-web-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Typecheck and build public website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cortex-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cortex-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
