<svg xmlns="http://www.w3.org/2000/svg" width="390" height="854" viewBox="0 0 390 854" role="img" aria-label="Главный экран Android-приложения CORTEX">
  <!-- Faithful vector of the current Android WebView's home() and composer()/navigation() layouts.
       Source: app/src/main/assets/web/{screens.js,style.css,art/mark.svg}. -->
  <defs>
    <clipPath id="display"><rect width="390" height="854" rx="39"/></clipPath>
    <linearGradient id="orbitOne" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".96"/><stop offset=".28" stop-color="#fff" stop-opacity=".07"/><stop offset=".66" stop-color="#fff" stop-opacity=".63"/><stop offset="1" stop-color="#fff" stop-opacity=".03"/></linearGradient>
    <linearGradient id="orbitTwo" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#fff" stop-opacity=".13"/><stop offset=".44" stop-color="#fff" stop-opacity=".7"/><stop offset=".77" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity=".55"/></linearGradient>
    <radialGradient id="coreGlass" cx=".31" cy=".06" r="1.14"><stop stop-color="#fff" stop-opacity=".26"/><stop offset=".36" stop-color="#b8b8b8" stop-opacity=".075"/><stop offset=".78" stop-color="#fff" stop-opacity=".055"/><stop offset="1" stop-color="#fff" stop-opacity=".15"/></radialGradient>
    <linearGradient id="dockFill" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#272727"/><stop offset=".26" stop-color="#090909"/><stop offset=".8" stop-color="#000"/><stop offset="1" stop-color="#1a1a1a"/></linearGradient>
    <radialGradient id="emblem" cx=".4" cy=".12" r=".8"><stop stop-color="#777" stop-opacity=".4"/><stop offset=".7" stop-color="#111" stop-opacity=".15"/><stop offset="1" stop-color="#000"/></radialGradient>
    <filter id="coreGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8"/></filter>
    <g id="mark" fill="none">
      <path d="M36 13.7 23 10 11 17v14l12 7 13-3.7" stroke="#fff" stroke-width="4.3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="29" cy="24" r="2.4" fill="#fff"/><circle cx="38" cy="24" r="1.55" fill="#fff"/>
    </g>
    <g id="micIcon" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.12">
      <rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-3 0h6"/>
    </g>
    <g id="waveIcon" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2.12">
      <path d="M3 10v4m4-7v10m5-14v18m5-14v10m4-7v4"/>
    </g>
  </defs>
  <g clip-path="url(#display)">
    <rect width="390" height="854" fill="#000"/>

    <!-- Header: same mark, wordmark, spacing and weight as .home-header .brand. -->
    <use href="#mark" transform="translate(17 12) scale(.563)"/>
    <text x="63" y="43" fill="#fff" font-family="Roboto,Segoe UI,Arial,sans-serif" font-weight="780" font-size="12" letter-spacing="2.6">CORTEX</text>

    <!-- Android home hero: the mark sits inside three elliptical glass orbits. -->
    <ellipse cx="195" cy="338" rx="112" ry="112" fill="none" stroke="#fff" stroke-opacity=".045" stroke-width=".7"/>
    <g fill="none" stroke-linecap="round">
      <ellipse cx="195" cy="338" rx="109" ry="77" transform="rotate(-30 195 338)" stroke="url(#orbitOne)" stroke-width="1.9" stroke-dasharray="220 70 55 170"/>
      <ellipse cx="195" cy="338" rx="100" ry="71" transform="rotate(43 195 338)" stroke="url(#orbitTwo)" stroke-width="1.45" stroke-dasharray="115 77 95 195" opacity=".79"/>
      <ellipse cx="195" cy="338" rx="88" ry="76" transform="rotate(-64 195 338)" stroke="#fff" stroke-width="1.25" stroke-opacity=".36" stroke-dasharray="94 123 80 140"/>
      <path d="M112 264c48-50 115-48 164 2" stroke="#fff" stroke-width=".8" opacity=".16"/>
    </g>
    <rect x="135" y="278" width="120" height="120" rx="53" transform="rotate(-31 195 338)" fill="url(#coreGlass)" stroke="#fff" stroke-width="1.1" stroke-opacity=".25"/>
    <use href="#mark" transform="translate(157 300) scale(1.58)" opacity=".3" filter="url(#coreGlow)"/>
    <use href="#mark" transform="translate(157 300) scale(1.58)"/>
    <text x="195" y="516" text-anchor="middle" fill="#fff" font-family="Roboto,Segoe UI,Arial,sans-serif" font-size="39" letter-spacing="-2.3" font-weight="760">Чем помочь?</text>

    <!-- Exact Android bottom composer layout and actual controls. -->
    <rect x="21" y="681" width="348" height="60" rx="27" fill="#000" stroke="#fff" stroke-opacity=".34"/>
    <path d="M40 683H345" stroke="#fff" stroke-opacity=".105" stroke-linecap="round"/>
    <text x="40" y="717" fill="#fff" fill-opacity=".59" font-family="Roboto,Segoe UI,Arial,sans-serif" font-size="16">Напишите Кортексу…</text>
    <circle cx="287" cy="711" r="22" fill="#000" stroke="#fff" stroke-opacity=".27"/>
    <g color="#fff"><use href="#micIcon" transform="translate(277 701) scale(.84)"/></g>
    <circle cx="339" cy="711" r="22" fill="#fff"/>
    <g color="#000"><use href="#waveIcon" transform="translate(329 701) scale(.87)"/></g>

    <!-- The same 5-tab rounded dark glass dock as CortexUI.navigation(). -->
    <rect x="12" y="778" width="366" height="66" rx="33" fill="url(#dockFill)" stroke="#fff" stroke-opacity=".32"/>
    <path d="M33 780H356" stroke="#fff" stroke-width=".7" stroke-opacity=".16" stroke-linecap="round"/>
    <g fill="none" stroke="#fff" stroke-opacity=".64" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(38 794) scale(.86)">
        <path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l1.5-4A8.5 8.5 0 1 1 21 11.5Z"/><path d="M8 12h.01m4 0h.01m4 0h.01"/>
      </g>
      <g transform="translate(109 794) scale(.87)"><path d="m13 2-9 12h7l-1 8 10-12h-7z"/></g>
      <g transform="translate(259 794) scale(.87)"><path d="M11 4H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-6M9 15l1-4L19 2l3 3-9 9z"/></g>
      <g transform="translate(327 794) scale(.87)"><circle cx="12" cy="7.5" r="3.5"/><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2z"/></g>
    </g>
    <g font-family="Roboto,Segoe UI,Arial,sans-serif" font-weight="620" font-size="10.5" text-anchor="middle" fill="#fff" fill-opacity=".64">
      <text x="48" y="832">Чаты</text><text x="119" y="832">Вызов</text>
      <text x="269" y="832">Заметки</text><text x="337" y="832">Профиль</text>
    </g>
    <circle cx="195" cy="811" r="25" fill="url(#emblem)" stroke="#fff" stroke-opacity=".74"/>
    <ellipse cx="195" cy="811" rx="21" ry="21" fill="none" stroke="#fff" stroke-opacity=".21" stroke-width=".8"/>
    <use href="#mark" transform="translate(178.5 794.5) scale(.6875)"/>
  </g>
</svg>
